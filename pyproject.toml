[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bazaarban"
version = "0.1.0"
description = "Persian small-business sales and customer analytics portfolio project"
requires-python = ">=3.11"
dependencies = ["pandas==2.2.3"]

[project.optional-dependencies]
test = ["pytest==9.0.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
